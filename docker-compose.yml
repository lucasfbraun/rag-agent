
services:
  # 1. Banco de Dados Vetorial On-Premise
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: pu_matcher_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Backend FastAPI + Agente Investigativo
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pu_matcher_backend
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/raw_documents:/app/data/raw_documents
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. Frontend Web Streamlit (Campo & Vendas Técnicas)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pu_matcher_frontend
    restart: always
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
