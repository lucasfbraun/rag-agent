
services:
  # 1. Banco de Dados Vetorial On-Premise
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: pu_matcher_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      # A imagem qdrant não tem curl/wget, mas tem bash com suporte a /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo 'ok' >&3 && exec 3>&-"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # 2. Banco Relacional — usuários/perfis (Fase 5, RBAC & Governança)
  postgres:
    image: postgres:16-alpine
    container_name: pu_matcher_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pu_matcher}
      POSTGRES_USER: ${POSTGRES_USER:-pu_matcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Subpasta: o volume bind-mount tem .gitkeep, e o postgres recusa inicializar
      # diretamente num diretório com arquivo oculto ("not empty").
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pu_matcher} -d ${POSTGRES_DB:-pu_matcher}"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  # 3. Backend FastAPI + Agente Investigativo
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pu_matcher_backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data/raw_documents:/app/data/raw_documents
    healthcheck:
      # python:3.11-slim tem Python nativo — sem dependência de curl/wget
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/').read() or sys.exit(1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 4. Frontend Web Streamlit (Campo & Vendas Técnicas)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pu_matcher_frontend
    restart: always
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:8501/_stcore/health').read() or sys.exit(1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
